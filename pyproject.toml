[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msproject-mcp"
version = "0.1.0"
description = "MCP server that drives desktop Microsoft Project through COM automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "microsoft-project", "com", "automation", "project-management"]
dependencies = [
    "mcp>=2,<3",
    "pywin32>=311",
]

[project.scripts]
msproject-mcp = "msproject_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msproject_mcp"]
